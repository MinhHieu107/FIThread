spring.application.name=FIThread

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fithread?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate - KHONG dung ddl-auto, de Flyway quan ly schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Mail (dev - Mailtrap hoac SMTP cua ban)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=nguyenminhhieubi1007@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App custom properties
app.allowed-email-domains=sv.hanu.edu.vn,hanu.edu.vn
app.otp-expiry-minutes=15
app.otp-max-attempts=5